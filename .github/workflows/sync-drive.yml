name: Sync Itinerary from Google Drive

on:
  workflow_dispatch: # 支援手動一鍵同步
  schedule:
    - cron: '0 21 * * *' # 每天台灣時間 05:00 自動定時執行

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Push Latest Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

          echo "=== 1. 開始下載雲端檔案 ==="
          curl -sL --max-time 120 "https://drive.google.com/uc?export=download&id=1LlsVUa_qlsb6m9CT9NDMTCgYFKqwEvrE" -o itinerary.json
          # index.html 改由 repo 直接維護（2307 Carve Log 新版首頁），不再從 Google Drive 覆蓋

          echo "=== 2. 注入即時時間戳記 (保證檔案每次必有實質變更) ==="
          python3 -c "import json, datetime; f=open('itinerary.json','r'); d=json.load(f); f.close(); d['last_synced']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC'); f=open('itinerary.json','w'); json.dump(d,f,ensure_ascii=False,indent=2); f.close()"

          echo "=== 3. 檢視檔案大小 ==="
          ls -lh itinerary.json

          echo "=== 4. 提交並推送至 main ==="
          git add itinerary.json
          git commit -m "Auto-sync: update itinerary.json [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push origin main
