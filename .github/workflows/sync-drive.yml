name: Sync Itinerary and UI from Google Drive

on:
  workflow_dispatch: # 支援網頁一鍵手動同步
  schedule:
    - cron: '0 0 * * *' # 每天固定自動同步

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Latest Files from Google Drive
        run: |
          # 1. 下載最新行程資料 itinerary.json
          curl -sL "https://drive.google.com/uc?export=download&id=1hu8B1gQO-3m0-F4Wk55DAQO5BKN_kQVs" -o itinerary.json
          # 2. 下載最新網頁版面 index.html
          curl -sL "https://drive.google.com/uc?export=download&id=13w50oLxHiPdB5VPSIAsZLdRUOxWFvgHN" -o index.html

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add itinerary.json index.html
          if git diff --staged --quiet; then
            echo "No changes in files"
          else
            git commit -m "Auto-sync: update itinerary.json and index.html from Google Drive"
            git push
          fi
