name: Sync Itinerary and UI from Google Drive

on:
  workflow_dispatch: # 支援隨時手動點擊一鍵同步
  schedule:
    # 每天台灣時間 05:00 (UTC 21:00) 自動自 Google Drive 拉取最新資料發布
    - cron: '0 21 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Push Latest Files
        run: |
          # 1. 設置身分並確保本地與遠端最新狀態同步
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

          # 2. 從 Google Drive 下載最新檔案
          curl -sL "https://drive.google.com/uc?export=download&id=1hu8B1gQO-3m0-F4Wk55DAQO5BKN_kQVs" -o itinerary.json
          curl -sL "https://drive.google.com/uc?export=download&id=13w50oLxHiPdB5VPSIAsZLdRUOxWFvgHN" -o index.html

          # 3. 檢查變更並提交推送
          git add itinerary.json index.html
          if git diff --staged --quiet; then
            echo "No changes in files"
          else
            git commit -m "Auto-sync: update itinerary.json and index.html from Google Drive"
            git push origin main
          fi
