name: Sync Itinerary and UI from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # 每天台灣時間 05:00 自動同步

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Push from Travel/Sb_2026 Folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

          # 安裝最新版 gdown
          pip install --upgrade gdown

          # 直接以固定資料夾 ID 同步（移除無效參數）
          gdown --folder "https://drive.google.com/drive/folders/1MmCMoyD-I3IntGxLl0vHpVFIDYW3uqXY" -O drive_download

          # 精準找出檔案並複製到根目錄
          find drive_download -name "itinerary.json" -exec cp {} . \;
          find drive_download -name "index.html" -exec cp {} . \;
          rm -rf drive_download

          git add itinerary.json index.html
          if git diff --staged --quiet; then
            echo "No changes in files"
          else
            git commit -m "Auto-sync: update itinerary.json and index.html from Travel/Sb_2026 folder"
            git push origin main
          fi

  retry-sync:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retry Sync and Push
        run: |
          echo "主要任務超時或失敗，正在啟動自動重試..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

          pip install --upgrade gdown
          gdown --folder "https://drive.google.com/drive/folders/1MmCMoyD-I3IntGxLl0vHpVFIDYW3uqXY" -O drive_download

          find drive_download -name "itinerary.json" -exec cp {} . \;
          find drive_download -name "index.html" -exec cp {} . \;
          rm -rf drive_download

          git add itinerary.json index.html
          if git diff --staged --quiet; then
            echo "No changes in files"
          else
            git commit -m "Auto-sync (retry): update itinerary.json and index.html"
            git push origin main
          fi
