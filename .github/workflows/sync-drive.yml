name: Sync Itinerary and UI from Google Drive

on:
  workflow_dispatch: # 支援手動一鍵同步
  schedule:
    - cron: '0 21 * * *' # 每天台灣時間 05:00 自動定時執行

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Push Latest Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

          echo "=== 1. 開始下載雲端檔案 ==="
          curl -sL --max-time 120 "https://drive.google.com/uc?export=download&id=1LlsVUa_qlsb6m9CT9NDMTCgYFKqwEvrE" -o itinerary.json
          curl -sL --max-time 120 "https://drive.google.com/uc?export=download&id=1-bQh_W7I6z_reHFpL1nI3pUUl1Y3Wm6x" -o index.html

          echo "=== 2. 檢視下載檔案大小與內容 ==="
          ls -lh itinerary.json index.html
          head -n 5 itinerary.json

          echo "=== 3. 檢查 Git 狀態並提交 ==="
          git add itinerary.json index.html
          if git diff --staged --quiet; then
            echo "Git 偵測到無內容差異，強制提交刷新時間戳記..."
            git commit --allow-empty -m "Auto-sync: force refresh [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin main
          else
            echo "Git 偵測到檔案變更，提交更新..."
            git commit -m "Auto-sync: update to latest 124KB itinerary.json and 26KB index.html"
            git push origin main
          fi

  retry-sync:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retry Sync and Push
        run: |
          echo "主要任務超時或失敗，正在啟動自動重試..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

          curl -sL --max-time 120 "https://drive.google.com/uc?export=download&id=1LlsVUa_qlsb6m9CT9NDMTCgYFKqwEvrE" -o itinerary.json
          curl -sL --max-time 120 "https://drive.google.com/uc?export=download&id=1-bQh_W7I6z_reHFpL1nI3pUUl1Y3Wm6x" -o index.html

          git add itinerary.json index.html
          git commit -m "Auto-sync (retry): update itinerary.json and index.html"
          git push origin main
